# Builds the wiki in docs/ and publishes it to GitHub Pages.
#
# Pull requests build but do not deploy, so a page that fails to render fails review
# rather than production. Only pushes to main actually publish.
#
# This needs Pages to be enabled for the repository with "GitHub Actions" as the source
# (Settings -> Pages -> Build and deployment -> Source).

name: Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a run in progress — a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to GitHub Pages
    # Only publish from main. A PR gets the build check above and nothing more.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
