name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-defs:
    name: Validate defs and translation keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore the RimWorld reference assemblies
        # refdump reads these to answer "is this a real vanilla type?". Restoring the mod
        # project is what puts them on disk.
        run: dotnet restore Source/OldWestTown/OldWestTown.csproj
      - name: Build refdump
        # Without it the type check downgrades to a note and every vanilla type named in XML
        # goes unverified — which is exactly the typo the validator exists to catch.
        run: dotnet build tools/refdump/refdump.csproj -c Release
      - name: Run static def checks
        run: python3 tools/validate_defs.py

  textures:
    name: Check every building has art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install --quiet Pillow
      - name: Check for buildings with no texture
        run: python3 tools/make_textures.py --check

  docs:
    name: Check the wiki matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every def, source file and translation key is documented
        # docs/ rots silently otherwise: nothing fails when someone adds a def and
        # forgets the page describing it. See docs/contributing.md.
        run: python3 tools/validate_docs.py

  build:
    name: Build assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build mod assembly
        run: dotnet build Source/OldWestTown/OldWestTown.csproj -c Release
      - name: Check committed assembly is current
        # The build is deterministic, so a fresh build should be byte-identical to the
        # committed DLL. A drift is a warning, not a failure: SDK differences can move bytes.
        run: |
          git diff --exit-code --stat 1.6/Assemblies/OldWestTown.dll \
            || echo "::warning::Committed OldWestTown.dll differs from a fresh build — rebuild and commit it"
